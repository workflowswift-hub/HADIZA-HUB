<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produit — HADIZA HUB</title>
<meta name="theme-color" content="#111112">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
  #zone-produit{
    display:grid;grid-template-columns:1fr;gap:2rem;
    padding:2.2rem 4vw 3rem;max-width:1200px;margin:0 auto;
  }
  @media(min-width:900px){#zone-produit{grid-template-columns:110px 1fr 1fr;}}
  .miniatures{display:flex;flex-direction:row;gap:0.7rem;order:2;}
  @media(min-width:900px){.miniatures{flex-direction:column;order:1;}}
  .mini{width:64px;height:64px;border:1px solid var(--gris-bord);cursor:pointer;flex-shrink:0;overflow:hidden;}
  .mini img{width:100%;height:100%;object-fit:cover;}
  .mini.active{border-color:var(--or);}
  .img-principale{order:1;background:var(--creme);border:1px solid var(--gris-bord);aspect-ratio:1/1;overflow:hidden;}
  @media(min-width:900px){.img-principale{order:2;}}
  .img-principale img{width:100%;height:100%;object-fit:cover;}
  .infos{order:3;}
  .infos .eyebrow{color:var(--or);font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.5rem;}
  .infos h1{font-size:1.8rem;margin-bottom:0.5rem;}
  .prix{font-size:1.4rem;margin:0.8rem 0;}
  .desc{color:var(--gris-txt);font-size:0.86rem;line-height:1.6;margin-bottom:1.2rem;}
  .bloc-select{margin-bottom:1.2rem;}
  .bloc-select .label{font-size:0.82rem;margin-bottom:0.5rem;}
  .tailles{display:flex;gap:0.6rem;flex-wrap:wrap;}
  .taille{padding:0.5rem 0.9rem;border:1px solid var(--gris-bord);font-size:0.82rem;cursor:pointer;background:#fff;}
  .taille.active{background:var(--noir);color:#fff;border-color:var(--noir);}
  .cta-row{margin-top:1.4rem;}
  .cta-row .btn{width:100%;}
  .reassurance-row{display:flex;gap:1.2rem;margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--gris-bord);font-size:0.72rem;color:var(--gris-txt);flex-wrap:wrap;}
</style>
</head>
<body>

<div class="banniere">🚚 LIVRAISON OFFERTE SUR ABIDJAN — 💵 PAIEMENT À LA LIVRAISON</div>

<header class="site">
  <a href="index.html"><img src="assets/logo.png" alt="HADIZA HUB"></a>
  <nav>
    <a href="catalogue.html?categorie=montres">Montres</a>
    <a href="catalogue.html?categorie=chaines">Chaînes</a>
    <a href="catalogue.html?categorie=bagues">Bagues</a>
    <a href="catalogue.html">Tout voir</a>
  </nav>
  <div class="header-icons">
    <a href="panier.html">🛍️<span id="cart-count" style="display:none;"></span></a>
  </div>
</header>

<div id="zone-produit">
  <p style="grid-column:1/-1;color:#7A776E;">Chargement du produit...</p>
</div>

<footer class="site">
  © 2026 HADIZA HUB — Abidjan <a class="admin-link" href="admin/index.html">·</a>
</footer>

<script type="module" src="js/panier.js"></script>
<script type="module" src="js/produit.js"></script>
</body>
</html>
